<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; font-weight: 600; }
      .tick-label { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #94a3b8; }
      .bar-before { fill: url(#gradBefore); rx: 5; }
      .bar-after { fill: url(#gradAfter); rx: 5; }
      .val-before { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #fca5a5; }
      .val-after { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #6ee7b7; }
      .badge { fill: #065f46; stroke: #10b981; stroke-width: 1; rx: 10; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #ecfdf5; }
      .grid-line { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; }
      .axis-line { stroke: #475569; stroke-width: 1.5; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #e2e8f0; font-weight: 500; }
    </style>
    <linearGradient id="gradBefore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="gradAfter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" class="bg" rx="16" />

  <!-- Header -->
  <text x="40" y="45" class="title">Oval Pay Finances — MySQL 8.0 Query Processing Speed Benchmark</text>
  <text x="40" y="68" class="subtitle">Execution Latency (ms) &amp; Optimizer Speedup Across 50,005 Ledger Transactions (EXPLAIN ANALYZE)</text>

  <!-- Legend -->
  <rect x="650" y="32" width="16" height="16" class="bar-before" />
  <text x="674" y="45" class="legend-text">Before Indexing / Unoptimised</text>
  <rect x="850" y="32" width="16" height="16" class="bar-after" />
  <text x="874" y="45" class="legend-text">After Composite / Covering Index</text>

  <!-- Main Chart Card -->
  <rect x="30" y="90" width="940" height="400" class="card" />

  <!-- Vertical Grid Lines (0ms to 70ms, scale: 1ms = 8.5px, origin x=270) -->
  <!-- 0 ms -->
  <line x1="270" y1="120" x2="270" y2="445" class="axis-line" />
  <text x="270" y="465" text-anchor="middle" class="tick-label">0 ms</text>

  <!-- 10 ms (x=355) -->
  <line x1="355" y1="120" x2="355" y2="445" class="grid-line" />
  <text x="355" y="465" text-anchor="middle" class="tick-label">10 ms</text>

  <!-- 20 ms (x=440) -->
  <line x1="440" y1="120" x2="440" y2="445" class="grid-line" />
  <text x="440" y="465" text-anchor="middle" class="tick-label">20 ms</text>

  <!-- 30 ms (x=525) -->
  <line x1="525" y1="120" x2="525" y2="445" class="grid-line" />
  <text x="525" y="465" text-anchor="middle" class="tick-label">30 ms</text>

  <!-- 40 ms (x=610) -->
  <line x1="610" y1="120" x2="610" y2="445" class="grid-line" />
  <text x="610" y="465" text-anchor="middle" class="tick-label">40 ms</text>

  <!-- 50 ms (x=695) -->
  <line x1="695" y1="120" x2="695" y2="445" class="grid-line" />
  <text x="695" y="465" text-anchor="middle" class="tick-label">50 ms</text>

  <!-- 60 ms (x=780) -->
  <line x1="780" y1="120" x2="780" y2="445" class="grid-line" />
  <text x="780" y="465" text-anchor="middle" class="tick-label">60 ms</text>

  <!-- 70 ms (x=865) -->
  <line x1="865" y1="120" x2="865" y2="445" class="grid-line" />
  <text x="865" y="465" text-anchor="middle" class="tick-label">70 ms</text>

  <!-- ================= QUERY 1: Monthly Wallet Statement ================= -->
  <text x="255" y="152" text-anchor="end" class="axis-label">Query 1: Wallet Statement</text>
  <text x="255" y="168" text-anchor="end" class="tick-label">(Filter + Date Range + Sort)</text>
  <!-- Before: 2.85 ms -> width 24.2px -->
  <rect x="270" y="132" width="25" height="20" class="bar-before" />
  <text x="303" y="147" class="val-before">2.85 ms (filesort)</text>
  <!-- After: 0.09 ms -> width 4px (min visible) -->
  <rect x="270" y="156" width="5" height="20" class="bar-after" />
  <text x="283" y="171" class="val-after">0.09 ms (Index Range Scan)</text>
  <!-- Badge -->
  <rect x="470" y="144" width="110" height="24" class="badge" />
  <text x="525" y="160" text-anchor="middle" class="badge-text">31.6x Faster</text>

  <!-- ================= QUERY 2: AML Outbound Volume Audit ================= -->
  <text x="255" y="232" text-anchor="end" class="axis-label">Query 2: AML Volume Audit</text>
  <text x="255" y="248" text-anchor="end" class="tick-label">(4-Table JOIN + GROUP BY)</text>
  <!-- Before: 64.32 ms -> width 546.7px -->
  <rect x="270" y="212" width="547" height="20" class="bar-before" />
  <text x="825" y="227" class="val-before">64.32 ms (Full Scan: 50,005 rows)</text>
  <!-- After: 8.11 ms -> width 68.9px -->
  <rect x="270" y="236" width="69" height="20" class="bar-after" />
  <text x="347" y="251" class="val-after">8.11 ms (Covering Index: 2,498 rows)</text>
  <!-- Badge -->
  <rect x="605" y="234" width="105" height="24" class="badge" />
  <text x="657" y="250" text-anchor="middle" class="badge-text">7.9x Faster</text>

  <!-- ================= QUERY 3: Merchant Settlement Summary ================= -->
  <text x="255" y="312" text-anchor="end" class="axis-label">Query 3: Merchant Settlement</text>
  <text x="255" y="328" text-anchor="end" class="tick-label">(Commission Revenue Report)</text>
  <!-- Before: 28.40 ms -> width 241.4px -->
  <rect x="270" y="292" width="241" height="20" class="bar-before" />
  <text x="519" y="307" class="val-before">28.40 ms (Clustered Table Lookup)</text>
  <!-- After: 3.15 ms -> width 26.8px -->
  <rect x="270" y="316" width="27" height="20" class="bar-after" />
  <text x="305" y="331" class="val-after">3.15 ms (Covering Index Scan)</text>
  <!-- Badge -->
  <rect x="515" y="314" width="105" height="24" class="badge" />
  <text x="567" y="330" text-anchor="middle" class="badge-text">9.0x Faster</text>

  <!-- ================= QUERY 4: Latest Wallet Transaction ================= -->
  <text x="255" y="392" text-anchor="end" class="axis-label">Query 4: Latest Wallet Tx</text>
  <text x="255" y="408" text-anchor="end" class="tick-label">(Subquery vs Window Rewrite)</text>
  <!-- Before: 41.20 ms -> width 350.2px -->
  <rect x="270" y="372" width="350" height="20" class="bar-before" />
  <text x="628" y="387" class="val-before">41.20 ms (Correlated Subquery)</text>
  <!-- After: 1.95 ms -> width 16.6px -->
  <rect x="270" y="396" width="17" height="20" class="bar-after" />
  <text x="295" y="411" class="val-after">1.95 ms (ROW_NUMBER() Window + Index)</text>
  <!-- Badge -->
  <rect x="565" y="394" width="110" height="24" class="badge" />
  <text x="620" y="410" text-anchor="middle" class="badge-text">21.1x Faster</text>

  <!-- Summary KPI Footer Cards -->
  <rect x="30" y="510" width="295" height="82" class="card" />
  <text x="50" y="538" class="subtitle">TOTAL BENCHMARK LATENCY (4 QUERIES)</text>
  <text x="50" y="568" class="title" fill="#6ee7b7">136.77 ms  →  13.30 ms</text>

  <rect x="352" y="510" width="295" height="82" class="card" />
  <text x="372" y="538" class="subtitle">OVERALL EXECUTION TIME REDUCTION</text>
  <text x="372" y="568" class="title" fill="#38bdf8">90.3% Latency Reduction</text>

  <rect x="675" y="510" width="295" height="82" class="card" />
  <text x="695" y="538" class="subtitle">ROWS EXAMINED (QUERY 2 AML SCAN)</text>
  <text x="695" y="568" class="title" fill="#facc15">50,005  →  2,498 Rows</text>
</svg>
